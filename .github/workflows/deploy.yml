name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.13.0

      - name: Print toolchain versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 서식은 eslint가 보지 않는다. eslint-config-prettier가 서식 규칙을 일부러
      # 꺼두기 때문이다(둘이 싸우지 않게 하려는 표준 구성). 그 결과 아무도
      # 서식을 검사하지 않아 조용히 어긋나 있었다. 여기서 본다.
      - name: Format check
        run: npm run format:check

      # functions/는 별도 배포라 src/를 import할 수 없어 두 파일을 복사해 쓴다.
      # 한쪽만 고쳐도 빌드와 테스트는 통과하고 알림 메일만 옛 데이터로 나간다.
      # 어긋난 순간에 잡는다.
      - name: Shared copy drift check
        run: npm run test:shared

      - name: SSR smoke test
        run: npm run test:smoke

      - name: Build
        run: npm run build
        env:
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          VITE_OPENWEATHER_BASE_URL: https://api.openweathermap.org
          # 아래 세 값이 없으면 배포본에서 구글 로그인이 비활성화되고
          # 플랜은 기기 저장으로만 동작한다 (앱은 그대로 뜬다).
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
