<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="F1 2026 시즌 서킷 날씨와 도시 날씨를 한 화면에서. Vue 3 + Vite + Pinia + Element Plus + Chart.js"
    />
    <meta name="theme-color" content="#00a68f" />
    <title>Weather F1 · F1 서킷 날씨 대시보드</title>
    <script>
      // FOUC 방지: Vue 마운트 전에 저장된 테마를 즉시 적용
      ;(function () {
        try {
          // 저장된 설정이 없으면 다크로 시작 (themeStore의 DEFAULT_MODE와 일치시킬 것)
          var mode = localStorage.getItem('skala-vue:theme') || 'dark'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage 접근 불가 시 기본 테마 사용 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
